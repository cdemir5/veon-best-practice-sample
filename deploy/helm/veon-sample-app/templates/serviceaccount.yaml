{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vsa.serviceAccountName" . }}
  labels:
    {{- include "vsa.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Uygulama Kubernetes API'sini kullanmaz → token mount edilmez.
automountServiceAccountToken: false
{{- end }}
