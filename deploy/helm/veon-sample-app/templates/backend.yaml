{{- $fullname := include "vsa.fullname" . -}}
{{- $component := dict "ctx" . "component" "backend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "vsa.componentLabels" $component | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0   # kapasite düşmeden rolling update
  selector:
    matchLabels:
      {{- include "vsa.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vsa.podLabels" $component | nindent 8 }}
      annotations:
        {{- include "vsa.checksums" . | nindent 8 }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "vsa.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      {{- include "vsa.topologySpread" $component | nindent 6 }}
      containers:
        - name: backend
          image: {{ include "vsa.image" (dict "ctx" . "image" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9100
          envFrom:
            {{- include "vsa.envFrom" . | nindent 12 }}
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ $fullname }}-backend
            {{- include "vsa.secretEnv" . | nindent 12 }}
          # startup: açılış uzun sürse de liveness erken öldürmesin
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          # liveness: yalnız process sağlığı (bağımlılık KONTROL ETMEZ)
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readiness: zorunlu bağımlılıklar (Mongo) hazır mı?
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # Endpoint'ten düşürülme yayılırken yeni istek kabul etmeye devam et,
            # sonra SIGTERM → uvicorn açık istekleri bitirir → event kuyruğu boşaltılır.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "vsa.containerSecurityContext" (dict "ctx" . "uid" 10001) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "vsa.componentLabels" $component | nindent 4 }}
    veon-sample/metrics: "true"
spec:
  type: ClusterIP
  selector:
    {{- include "vsa.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "vsa.componentLabels" $component | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-backend
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # yük dalgalanmasında replika "zıplamasın"
{{- end }}
