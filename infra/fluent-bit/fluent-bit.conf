# Fluent Bit — log yönlendirici (EFK'deki "F").
#
#   container stdout ──(Docker fluentd log driver, async + non-blocking)──► :24224
#        └► parser (JSON) ► modify (etiketler) ► ┬► Loki            (varsayılan)
#                                                 └► Elasticsearch  (FLUENT_ES_MATCH='app.*' ise)
#
# Uygulama log backend'ini bilmez; çıkış eklemek/değiştirmek yalnız bu dosyadadır.
# Backend erişilemezse kayıtlar disk buffer'ında bekler (storage.type filesystem).

[SERVICE]
    Flush                     1
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    storage.path              /fluent-bit/buffer/
    storage.sync              normal
    storage.backlog.mem_limit 16M
    storage.metrics           On

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    storage.type  filesystem
    Mem_Buf_Limit 32MB

# Uygulama satırı JSON ise alanlara aç (level, message, otel_trace_id ...).
[FILTER]
    Name         parser
    Match        app.*
    Key_Name     log
    Parser       json
    Reserve_Data On

# Docker label'ından compose servis adını al; JSON'da `service` yoksa onu kullan.
[FILTER]
    Name    modify
    Match   app.*
    Rename  com.docker.compose.service compose_service
    Copy    compose_service service
    Remove  container_id
    Remove  source

# Collector tarafında ikinci maskeleme hattı (uygulama maskelemesine EK).
[FILTER]
    Name    lua
    Match   app.*
    script  /fluent-bit/etc/redact.lua
    call    redact

[OUTPUT]
    Name                     loki
    Match                    app.*
    Host                     loki
    Port                     3100
    # Label'lar DÜŞÜK kardinaliteli olmalı. trace_id/request_id gövdede kalır.
    Labels                   job=fluent-bit, service=$service, level=$level
    Line_Format              json
    Retry_Limit              10
    storage.total_limit_size 256M

[OUTPUT]
    Name                     es
    Match                    ${FLUENT_ES_MATCH}
    Host                     elasticsearch
    Port                     9200
    Logstash_Format          On
    Logstash_Prefix          veon-sample-logs
    Suppress_Type_Name       On
    Replace_Dots             On
    # Retry'da aynı kaydın iki kez yazılmaması için deterministik _id.
    Generate_ID              On
    Retry_Limit              10
    storage.total_limit_size 256M
